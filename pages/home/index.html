<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- <script src="https://unpkg.com/@tailwindcss/browser@4"></script> -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="container">
    <nav class="header-wrapper">
      <a class="logo-link" href="/" title="Home">
        <img id="logo" src="/assets/compresso-logo.svg" alt="Compresso Logo">
        <label for="logo">Compresso</label>
      </a>
    </nav>
  </header>

  <section class="container">
    <div class="hero-wrapper">
      <div class="hero-title">
        <h1>Upload an image to <span>compress</span> and <span>reduce</span> its size without losing quality. </h1>
      </div>
      <div class="hero-upload">
        <div class="dropbox">
          <div class="dropbox-inner">
            <div class="dropbox-icon">
              <img src="/assets/upload-icon.svg" alt="Upload Icon">
            </div>
            <div class="dropbox-text">
              <p class="title">Drag & drop</p>
              <p class="or">or</p>
              <button class="btn">Select Files</button>
              <p class="max-info">Up to 100 images, max 100 MB each.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
