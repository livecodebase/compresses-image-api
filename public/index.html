<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compress JPEG and PNG Images - Compresso</title>
    <meta name="description" content="Compress JPEG and PNG images online without losing quality. Reduce image size for faster loading times and better performance." />
    <meta name="keywords" content="compress images, JPEG, PNG, image compression, reduce image size, online image compressor" />
    <meta property="og:title" content="Compress JPEG and PNG Images - Compresso" />
    <meta property="og:description" content="Compress JPEG and PNG images online without losing quality. Reduce image size for faster loading times and better performance." />
    <meta property="og:image" content="/assets/compresso-logo.svg" />
    <meta property="og:url" content="https://compresso.livecodebase.com" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/assets/favicon/favicon.ico" type="image/x-icon" />
    <!-- <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    /> -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="/assets/css/uikit.min.css"
    />
    <link rel="stylesheet" href="/assets/css/app.css" />
  </head>
  <body>
    <header class="container">
      <nav class="header-wrapper">
        <a class="logo-link" href="/" title="Home">
          <img
            id="logo"
            src="/assets/compresso-logo.svg"
            alt="Compresso Logo"
          />
          <label for="logo">Compresso</label>
        </a>
      </nav>
    </header>

    <section class="container">
      <div class="hero-wrapper">
        <div class="hero-title">
          <h1>
            Upload an image to <span>compress</span> and <span>reduce</span> its
            size without losing quality.
          </h1>
        </div>
        <div class="hero-upload">
          <div class="dropbox" id="dropzone">
            <div class="dropbox-inner">
              <div class="dropbox-icon">
                <img src="/assets/upload-icon.svg" alt="Upload Icon" />
              </div>
              <div class="dropbox-text">
                <p class="title">Drag & drop</p>
                <p class="or">or</p>
                <button class="btn">Select Images</button>
                <p class="max-info">Up to 100 images, max 100 MB each.</p>
                <p class="max-info -files">Supported files: jpeg, png, avif, webp, heic</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section class="container cil-wrap">
      <div class="compress-images-list" style="display: none;">
        <ul class="list-ul" id="images-list"></ul>
      </div>
    </section>

    <div class="dragging-overlay"></div>

    <link rel="stylesheet" href="/assets/css/rangeslider.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.1/themes/base/jquery-ui.min.css"
      integrity="sha512-TFee0335YRJoyiqz8hA8KV3P0tXa5CpRBSoM0Wnkn7JoJx1kaq1yXL/rb8YFpWXkMOjRcv5txv+C6UluttluCQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="/assets/js/jquery.min.js" defer></script>
    <script src="/assets/js/jquery-ui.min.js" defer></script>
    <script src="/assets/js/uikit.min.js" defer></script>
    <script src="/assets/js/uikit-icons.min.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <script src="/assets/js/notyf.min.js" defer></script>
    <script src="/assets/js/script.js" type="module" defer></script>
  </body>
</html>
